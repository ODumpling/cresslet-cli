name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tests reach their 127.0.0.1 fake API as `localhost` too: on Linux runners that resolves to ::1 first.
env:
  NODE_OPTIONS: --dns-result-order=ipv4first

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # builds dist/, then runs its tests

  # The published package supports Node >= 22.13 (package.json engines): build with the dev toolchain (Node 24, which
  # runs the .ts build scripts), then run the built CLI and its tests on the oldest supported Node.
  node-22-13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node --version
      - run: node dist/bin/cresslet.js --version
      - run: node --test dist/test/*.test.js
