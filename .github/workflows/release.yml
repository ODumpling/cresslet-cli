name: Release

# Push a tag matching package.json's version to publish:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, needed for OIDC
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json version
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test # builds dist/ and tests it; npm publish builds it again (prepare)

      # Trusted publishing: configure on npmjs.com (package settings) for
      # ODumpling/cresslet-cli, workflow release.yml. No token needed.
      - run: npm publish --provenance --access public

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
